name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "*.md"
      - "architecture/**"
      - "adr/**"
      - ".claude/skills/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "*.md"
      - "architecture/**"
      - "adr/**"
      - ".claude/skills/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: pip install -r website/requirements.txt
      - run: python website/stage.py
      - run: mkdocs build --strict -f website/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
